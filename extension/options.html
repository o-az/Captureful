<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrollingScreenshot settings</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, -apple-system, sans-serif; max-width: 520px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(127, 127, 127, 0.25); }
  label small { display: block; opacity: 0.7; }
  select { margin-left: auto; font: inherit; }
  button { margin-top: 16px; font: inherit; padding: 6px 10px; border-radius: 4px; }
  #status { margin-left: 8px; opacity: 0.7; }
</style>
</head>
<body>
<h1>ScrollingScreenshot</h1>
<label><input type="checkbox" id="confirmArea"><span>Confirm area<small>Ask before capturing the area you start scrolling.</small></span></label>
<label><input type="checkbox" id="autoStop"><span>Auto-stop at end<small>Finish when you've stayed at the end of the area for 3 seconds, or auto-scroll reaches it.</small></span></label>
<label><span>Output scale<small>Auto keeps the screen's full resolution.</small></span>
  <select id="scale"><option value="0">Auto</option><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select>
</label>
<button type="button" id="forget">Forget remembered areas</button><span id="status"></span>
<script src="options.js"></script>
</body>
</html>
